[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-janitor"
version = "0.1.0"
description = "Session lifecycle janitor for Devin Desktop — export-then-delete safety pipeline with tiered classification and pluggable judge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
    "devin-internals-spec>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devin-janitor = "devin_janitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
