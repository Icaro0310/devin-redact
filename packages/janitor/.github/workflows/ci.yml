name: ci

# Thin caller: the test and secrets-scan jobs live in the control plane
# (Icaro0310/devin-powerups/.github/workflows, tag @v1). Repos whose ci.yml
# diverges from the shared shape are documented in VARIANTS.md there.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1

  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1
