[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-backup"
version = "0.1.0"
description = "Backup and restore Devin Desktop stores safely — snapshots, rotation, integrity checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
    "devin-internals-spec>=0.3.0,<0.4.0",
    "devin-install-scheduler>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devin-backup = "devin_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
devin-install-scheduler = { workspace = true }
