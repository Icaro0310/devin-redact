name: Feature request
description: Suggest an improvement or a new capability for devin-backup
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or pain point, not just the feature
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      placeholder: "e.g. `tool subcommand --flag` should ..."
